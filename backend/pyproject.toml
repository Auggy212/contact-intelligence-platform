[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "contract-intelligence-backend"
version = "0.1.0"
description = "Contract Intelligence Platform — multi-tenant SaaS backend"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pgvector>=0.3.2",

    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",

    # Cache & task queue
    "redis>=5.0.4",
    "celery>=5.4.0",
    "kombu>=5.3.5",

    # Document parsing
    "python-docx>=1.1.2",
    "lxml>=5.2.2",
    "pymupdf>=1.24.4",

    # AI & embeddings
    "anthropic>=0.28.0",
    "voyageai>=0.2.3",
    "qdrant-client>=1.9.1",

    # File storage
    "boto3>=1.34.0",
    "minio>=7.2.7",

    # Auth (Clerk JWT verification)
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",

    # Billing
    "stripe>=9.9.0",

    # Email
    "resend>=2.0.0",

    # PDF export
    "reportlab>=4.2.0",

    # Email validation (required for pydantic EmailStr)
    "email-validator>=2.1.0",

    # Utilities
    "structlog>=24.1.0",
    "python-slugify>=8.0.4",
    "arrow>=1.3.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.3",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/migrations/*", "tests/*"]
