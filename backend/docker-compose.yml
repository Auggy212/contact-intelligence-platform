# =============================================================================
# Contract Intelligence Platform — Docker Compose
# =============================================================================
# Quick start:
#   make setup   ← first time only (copies .env, runs migrations, seeds test DB)
#   make dev     ← starts everything
#
# When the company provides managed services (RDS, ElastiCache, S3, etc.):
#   Comment out or remove the corresponding service block below and update
#   the matching variables in your .env file to point to the company endpoint.
# =============================================================================

services:

  # ── FastAPI app ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery worker ───────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/celery.Dockerfile
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    # NOTE: --pool=solo is NOT used here — that flag is Windows-only.
    # Inside Linux containers, normal multiprocessing works fine.
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q parsing,agents,email

  # ── Celery Beat (scheduled tasks) ───────────────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: docker/celery.Dockerfile
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: true
    depends_on:
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info

  # ── PostgreSQL 16 with pgvector ─────────────────────────────────────────────
  # Remove this block when the company provides a managed Postgres (RDS, etc.)
  # and update DATABASE_URL in .env to point to their host.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cipdb
      POSTGRES_USER: cipuser
      POSTGRES_PASSWORD: cippassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipuser -d cipdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-time DB setup (migrations + test DB) ────────────────────────────────
  # Runs alembic upgrade head and creates cipdb_test with required extensions.
  # Exits after completion — not a long-running service.
  # Triggered by: make setup  (or manually: docker compose run --rm db-init)
  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://cipuser:cippassword@db:5432/cipdb
    volumes:
      - .:/app
    command: sh /app/docker/init-test-db.sh
    restart: "no"

  # ── Redis ───────────────────────────────────────────────────────────────────
  # Remove this block when the company provides managed Redis (ElastiCache, etc.)
  # and update REDIS_URL in .env to point to their endpoint.
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible local storage) ─────────────────────────────────────
  # Remove this block when the company provides AWS S3 (or equivalent).
  # Set STORAGE_BACKEND=s3 and fill in AWS_* variables in .env.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket initialiser ─────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/contract-intelligence;
      mc anonymous set none local/contract-intelligence;
      echo 'MinIO bucket ready';
      "
    restart: "no"

  # ── Qdrant (vector database) ─────────────────────────────────────────────────
  # Remove this block when the company provides Qdrant Cloud.
  # Set QDRANT_URL and QDRANT_API_KEY in .env to point to their cluster.
  qdrant:
    image: qdrant/qdrant:v1.8.4
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC port
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
